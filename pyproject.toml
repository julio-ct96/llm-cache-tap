[tool.mypy]
python_version = "3.12"
files = [
    "cachetap/record.py",
    "cachetap/providers/base.py",
    "cachetap/providers/anthropic.py",
    "cachetap/providers/openai.py",
    "cachetap/providers/__init__.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
