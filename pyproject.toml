[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = [
    "cachetap/record.py",
    "cachetap/providers/base.py",
    "cachetap/providers/anthropic.py",
    "cachetap/providers/openai.py",
    "cachetap/providers/__init__.py",
    "cachetap/request_body.py",
    "cachetap/segments.py",
    "cachetap/linking.py",
    "cachetap/verdict.py",
    "cachetap/response_body.py",
    "cachetap/store.py",
    "cachetap/dashboard.py",
    "cachetap/config.py",
    "tap.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
